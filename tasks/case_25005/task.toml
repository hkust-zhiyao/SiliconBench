version = "1.0"

[metadata]
task_id = "case_25005"
title = "Harden Caliptra HMAC-384/512 & SP 800-90A HMAC_DRBG Prime Rejection, KeyVault Isolation, AHB Word Guards, and Zeroize/Debug Sanitization"
repository = "chipsalliance/caliptra-rtl"
repo_id = "repo_50"
split = "test"
eda_stage = "stage2_synth_gate"
eda_stage_name = "Stage 2: Logic Synthesis & Gate-Level Verification"
problem_type = "PT4_GateLevel_Security_CDC"
problem_type_label = "Gate-Level Equivalence, Security & CDC/RDC"
primary_domain = "Security_RoT_Subsystems"
domains = ["Security_RoT_Subsystems"]
public_rtl_files = 38
public_rtl_loc = 9486
editable_files_count = 3
editable_loc = 1005

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
timeout_sec = 600
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[verifier.environment]
allow_internet = false

[siliconbench]
allowed_edits = ["code/hmac.sv", "code/hmac_ctrl.sv", "code/hmac_drbg.sv"]
pdk_id = "rtl_dual_sim_standard"
pdk_name = "Standard IEEE 1800-2017 SystemVerilog Dual-Simulator + Yosys Slang"
pdk_customized = false
accepts_seed = true
grading_seeds = [101, 202]
