version = "1.0"

[metadata]
task_id = "case_0091"
title = "NEureka Normalization-Quantization Rounding-Saturation, Stall Coherence, and Area/Timing Closure"
repository = "pulp-platform/neureka"
repo_id = "repo_31"
split = "test"
eda_stage = "stage3_sta_cdc"
