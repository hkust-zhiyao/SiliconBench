version = "1.0"

[metadata]
task_id = "case_0009"
title = "Keep HWPE Micro-Loop Multi-Op Results, Loop Metadata, and Clears Coherent Across Stalls"
repository = "pulp-platform/hwpe-ctrl"
repo_id = "repo_33"
split = "test"
eda_stage = "stage1_rtl_sim"
eda_stage_name = "Stage 1: Frontend RTL Design & Functional Simulation"
problem_type = "PT1_Arch_Protocol_Bug_Repair"
problem_type_label = "Architectural & Protocol Bug Repair"
primary_domain = "rtl_integration"
domains = ["reset_rdc", "rtl_integration"]
public_rtl_files = 2
public_rtl_loc = 648
editable_files_count = 1
editable_loc = 495

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
timeout_sec = 600
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[verifier.environment]
allow_internet = false

[siliconbench]
allowed_edits = ["code/hwpe_ctrl_uloop.sv"]
pdk_id = "rtl_dual_sim_standard"
pdk_name = "Standard IEEE 1800-2017 SystemVerilog Dual-Simulator + Yosys Slang"
pdk_customized = false
accepts_seed = true
grading_seeds = [101, 202]
