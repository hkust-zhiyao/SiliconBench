version = "1.0"

[metadata]
task_id = "case_25011"
title = "Harden Caliptra Masked SHA-512 Share Non-Cancellation, Per-Round Refreshing, Masked Chaining, and Synchronous Zeroize"
repository = "chipsalliance/caliptra-rtl"
repo_id = "repo_50"
split = "test"
eda_stage = "stage3_sta_cdc"
eda_stage_name = "Stage 3: Static Timing (STA) & CDC/RDC Closure"
problem_type = "PT4_GateLevel_Security_CDC"
problem_type_label = "Gate-Level Equivalence, Security & CDC/RDC"
primary_domain = "Security_RoT_Subsystems"
domains = ["Security_RoT_Subsystems"]
public_rtl_files = 5
public_rtl_loc = 1440
editable_files_count = 3
editable_loc = 1133

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
timeout_sec = 600
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[verifier.environment]
allow_internet = false

[siliconbench]
allowed_edits = ["code/sha512_masked_defines_pkg.sv", "code/sha512_masked_w_mem.sv", "code/sha512_masked_core.sv"]
pdk_id = "rtl_dual_sim_standard"
pdk_name = "Standard IEEE 1800-2017 SystemVerilog Dual-Simulator + Yosys Slang"
pdk_customized = false
accepts_seed = true
grading_seeds = [101, 202]
