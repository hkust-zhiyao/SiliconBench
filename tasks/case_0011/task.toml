version = "1.0"

[metadata]
task_id = "case_0011"
title = "Reduce Area and Critical-Path Delay in the HWPE Chunked Stride Multiplier"
repository = "pulp-platform/hwpe-ctrl"
repo_id = "repo_33"
split = "test"
eda_stage = "stage4_macro_pnr"
eda_stage_name = "Stage 4: Hard-SRAM Floorplanning, CTS & Routing (PnR)"
problem_type = "PT3_Timing_Area_PPA_Closure"
problem_type_label = "High-Frequency Timing & Area Optimization"
primary_domain = "arithmetic_datapath"
domains = ["arithmetic_datapath", "synthesis_qor"]
public_rtl_files = 3
public_rtl_loc = 757
editable_files_count = 1
editable_loc = 109

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
timeout_sec = 1200
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[verifier.environment]
allow_internet = false

[siliconbench]
allowed_edits = ["code/rtl/hwpe_ctrl_partial_mult.sv"]
pdk_id = "nangate45_plus_multicorner_lib"
pdk_name = "Nangate45 45nm Open Cell Library + Task Multi-Corner Liberty/SDC"
pdk_customized = true
accepts_seed = true
grading_seeds = [1, 2]
