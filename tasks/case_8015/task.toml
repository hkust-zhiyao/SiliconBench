version = "1.0"

[metadata]
task_id = "case_8015"
title = "VeeR EL2 Smepmp CSR Lock/WARL Enforcement, TOR/NAPOT Priority Access Checker, and Transparent Sideband Timing Budgets"
repository = "chipsalliance/cores-veer-el2"
repo_id = "repo_08"
split = "test"
eda_stage = "stage3_sta_cdc"
eda_stage_name = "Stage 3: Static Timing (STA) & CDC/RDC Closure"
problem_type = "PT4_GateLevel_Security_CDC"
problem_type_label = "Gate-Level Equivalence, Security & CDC/RDC"
primary_domain = "verification_debug"
domains = ["rtl_integration", "rtl_semantics", "sdc_sta", "verification_debug"]
public_rtl_files = 9
public_rtl_loc = 2556
editable_files_count = 3
editable_loc = 512

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
timeout_sec = 600
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[verifier.environment]
allow_internet = false

[siliconbench]
allowed_edits = ["code/el2_dec_pmp_ctl.sv", "code/el2_pmp.sv", "constraints.json"]
pdk_id = "nangate45_45nm_shared"
pdk_name = "Nangate45 45nm Open Cell Library (Shared Base Image)"
pdk_customized = false
accepts_seed = true
grading_seeds = [1, 2]
