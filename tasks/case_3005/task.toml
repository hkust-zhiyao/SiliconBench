version = "1.0"

[metadata]
task_id = "case_3005"
title = "CV32E40P Hardware-Loop Register File Nested-Loop End-PC Resolution, APU Dispatcher Flush Drain, and Transparent Channel Timing Budgets"
repository = "openhwfoundation/cv32e40p"
repo_id = "repo_03"
split = "test"
eda_stage = "stage3_sta_cdc"
eda_stage_name = "Stage 3: Static Timing (STA) & CDC/RDC Closure"
problem_type = "PT3_Timing_Area_PPA_Closure"
problem_type_label = "High-Frequency Timing & Area Optimization"
primary_domain = "sdc_sta"
domains = ["reset_rdc", "rtl_integration", "sdc_sta"]
public_rtl_files = 4
public_rtl_loc = 416
editable_files_count = 3
editable_loc = 299

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
timeout_sec = 1200
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[verifier.environment]
allow_internet = false

[siliconbench]
allowed_edits = ["code/cv32e40p_hwloop_regs.sv", "code/cv32e40p_apu_disp.sv", "constraints.json"]
pdk_id = "custom_multicorner_liberty"
pdk_name = "Task-Specific Multi-Corner Liberty & SDC Timing Views"
pdk_customized = true
accepts_seed = true
grading_seeds = [1, 2]
