version = "1.0"

[metadata]
task_id = "case_2002"
title = "Ibex TRVK Capability Revocation Bridge Backpressure, Heap-Base Underflow Guard, Flush Recovery, and Transparent Channel Timing Budgets"
repository = "lowRISC/ibex"
repo_id = "repo_02"
split = "test"
eda_stage = "stage3_sta_cdc"
