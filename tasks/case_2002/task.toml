domains = ["protocol_control", "reset_rdc", "rtl_integration", "rtl_semantics", "sdc_sta", "verification_debug"]
public_rtl_files = 22
public_rtl_loc = 6329
editable_files_count = 3
editable_loc = 430

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
