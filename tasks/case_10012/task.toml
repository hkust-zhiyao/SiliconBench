version = "1.0"

[metadata]
task_id = "case_10012"
title = "OpenPiton 8-Port Chipset I/O Crossbar Route Decoding, 8-Bit Payload Framing, Output Arbitration Fairness, and Timing Closure"
repository = "princetonuniversity/openpiton"
repo_id = "repo_10"
split = "test"
eda_stage = "stage3_sta_cdc"
eda_stage_name = "Stage 3: Static Timing (STA) & CDC/RDC Closure"
problem_type = "PT1_Arch_Protocol_Bug_Repair"
problem_type_label = "Architectural & Protocol Bug Repair"
primary_domain = "parameters_widths"
domains = ["parameters_widths", "protocol_control", "rtl_integration"]
public_rtl_files = 11
public_rtl_loc = 792
editable_files_count = 3
editable_loc = 324

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
timeout_sec = 1200
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[verifier.environment]
allow_internet = false

[siliconbench]
allowed_edits = ["code/rtl/io_xbar_input_route_request_calc.v", "code/rtl/io_xbar_input_control.v", "code/rtl/io_xbar_output_control.v"]
pdk_id = "nangate45_plus_multicorner_lib"
pdk_name = "Nangate45 45nm Open Cell Library + Task Multi-Corner Liberty/SDC"
pdk_customized = true
accepts_seed = true
grading_seeds = [1, 2]
