version = "1.0"

[metadata]
task_id = "case_1003"
title = "OpenTitan KMAC Message Packer, FIFO Flush Control, and Error Checker Closure"
repository = "lowRISC/opentitan"
repo_id = "repo_01"
split = "test"
eda_stage = "stage4_macro_pnr"
eda_stage_name = "Stage 4: Hard-SRAM Floorplanning, CTS & Routing (PnR)"
problem_type = "PT4_GateLevel_Security_CDC"
problem_type_label = "Gate-Level Equivalence, Security & CDC/RDC"
primary_domain = "protocol_control"
domains = ["parameters_widths", "protocol_control", "reset_rdc", "rtl_integration", "verification_debug"]
public_rtl_files = 24
public_rtl_loc = 6048
editable_files_count = 3
editable_loc = 1188

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
timeout_sec = 1200
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[verifier.environment]
allow_internet = false

[siliconbench]
allowed_edits = ["code/prim_packer.sv", "code/kmac_msgfifo.sv", "code/kmac_errchk.sv"]
pdk_id = "nangate45_plus_multicorner_lib"
pdk_name = "Nangate45 45nm Open Cell Library + Task Multi-Corner Liberty/SDC"
pdk_customized = true
accepts_seed = true
grading_seeds = [1, 2]
