version = "1.0"

[metadata]
task_id = "case_0103"
title = "Coupled WB2AXIP Outstanding Credit Tracking, Wishbone Error Abort Drain, and Nangate45 Area/Timing Closure"
repository = "zipcpu/wb2axip"
