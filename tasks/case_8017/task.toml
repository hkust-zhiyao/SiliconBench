version = "1.0"

[metadata]
task_id = "case_8017"
title = "VeeR EL2 LSU Load/Store Control, Memory-Map Address/Exception Checker, Hardware Trigger Unit, and Transparent Sideband Timing Budgets"
repository = "chipsalliance/cores-veer-el2"
repo_id = "repo_08"
split = "test"
eda_stage = "stage3_sta_cdc"
eda_stage_name = "Stage 3: Static Timing (STA) & CDC/RDC Closure"
problem_type = "PT3_Timing_Area_PPA_Closure"
problem_type_label = "High-Frequency Timing & Area Optimization"
primary_domain = "verification_debug"
domains = ["rtl_integration", "sdc_sta", "verification_debug"]
public_rtl_files = 10
public_rtl_loc = 2751
editable_files_count = 4
editable_loc = 659

[agent]
timeout_sec = 5400

[environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
timeout_sec = 600
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[verifier.environment]
allow_internet = false

[siliconbench]
allowed_edits = ["code/el2_lsu_lsc_ctl.sv", "code/el2_lsu_addrcheck.sv", "code/el2_lsu_trigger.sv", "constraints.json"]
pdk_id = "nangate45_45nm_shared"
pdk_name = "Nangate45 45nm Open Cell Library (Shared Base Image)"
pdk_customized = false
accepts_seed = true
grading_seeds = [1, 2]
