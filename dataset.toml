# SiliconBench Standardized Harbor Benchmark Suite Configuration
version = "1.0"
name = "siliconbench"
title = "SiliconBench: A Full-Stack Agent Benchmark for Real-World Hardware Engineering"
description = "94 full-stack hardware engineering tasks curated from 30 real-world open-source SystemVerilog repositories in the two-container Harbor architecture."
total_tasks = 94

[defaults.agent]
timeout_sec = 5400

[defaults.environment]
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
dockerfile = "environments/siliconbench-eda/Dockerfile"
workdir = "/workspace"
allow_internet = false
cpus = 4
memory_mb = 16384

[defaults.environment.variables]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MAKEFLAGS = "-j1"
SILICONBENCH_TOOLS = "/opt/siliconbench/tools"
SILICONBENCH_NANGATE45 = "/opt/siliconbench/pdk/Nangate45"

[defaults.verifier]
environment_mode = "separate"
image = "siliconbench-eda:1.0"
docker_image = "siliconbench-eda:1.0"
entrypoint = "/tests/test.sh"
reward_file = "/logs/verifier/reward.txt"
reward_json = "/logs/verifier/reward.json"

[defaults.verifier.environment]
allow_internet = false

